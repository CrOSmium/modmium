<!doctype html>
<html lang="en" class="loading" cros chrome-refresh-2023="" chrome-refresh-2030="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modmium</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css" />
    <link rel="stylesheet" href="chrome://resources/chromeos/colors/cros_styles.css" />
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=legacy,sys" />
    <link rel="stylesheet" href="chrome://theme/typography.css" />
    <style>
      html:not(body) {
        --iron-icon-fill-color: var(--cros-icon-color-primary);
        --cr-focus-outline-color: var(--cros-focus-ring-color);
        --cr-focused-item-color: var(--cros-highlight-color-focus);
        --cr-link-row-start-icon-color: var(--cros-icon-color-primary);
        --cr-primary-text-color: var(--cros-text-color-primary);
        --cr-secondary-text-color: var(--cros-text-color-secondary);
        --cr-tooltip-icon-fill-color: var(--cros-icon-color-primary);
      }

      html {
        --settings-base-bg-color: var(--cros-sys-surface3);
        --settings-menu-padding-inline-end: 16px;
        --settings-menu-padding-inline-start: 16px;
        --settings-menu-padding-top: 16px;
        --settings-menu-item-border-width: 2px;
        --settings-menu-item-width: 256px;
        --settings-menu-width: 288px;
        --settings-row-min-height: 64px;
        --settings-toolbar-height: 72px;
        --settings-toolbar-padding-inline-start: 32px;
        --settings-toolbar-padding-inline-start-narrow: 16px;
        --settings-toolbar-padding-inline-end: 16px;
        --settings-toolbar-padding-top: 0;
        --settings-toolbar-search-box-height: 48px;
        --settings-toolbar-search-box-width: 480px;
        --settings-toolbar-narrow-search-box-width: 512px;
        --settings-toolbar-search-field-border-radius: 24px;
        background-color: var(--settings-base-bg-color);
        overflow: hidden;
        touch-action: manipulation;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font: var(--cros-body-2-font);
      }

      @media (prefers-color-scheme: dark) {
        html {
          --settings-base-bg-color: var(--cros-sys-app_base_shaded);
        }
      }
    </style>
  </head>
  <body class="jelly-enabled">
    <modmium-settings-ui></modmium-settings-ui>
    <script type="module" src="chrome://resources/cr_components/commerce/shopping_service_browser_proxy.js"></script>
  </body>
</html>
